[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-research-desk"
version = "0.1.0"
description = "A-share multi-factor screener, sector analysis, daily reports and notifications"
requires-python = ">=3.9"
dependencies = [
  "akshare>=1.16.0",
  "apscheduler>=3.10,<4",
  "baostock>=0.9.3,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
research = ["lightgbm==4.6.0"]
master = ["torch==2.5.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
